<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAZAAR — Connexion</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Connectez-vous ou créez votre compte BAZAAR.">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#B7F000">
<style>.logo-wordmark{font-family:'Nunito','Manrope',system-ui,sans-serif;font-weight:900;letter-spacing:-.02em;line-height:1}.logo-wordmark--deep{color:#123B16}.logo-wordmark--light{color:#fff}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/showcase.css?v=20260929">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="assets/js/showcase.js?v=20260929" defer></script>
<style>
  :root {
    --mboa-lime: #B7F000;
    --mboa-lime-bright: #C8FF1A;
    --mboa-green-deep: #123B16;
    --mboa-green-dark: #0B2410;
    --mboa-white: #FFFFFF;
    --mboa-white-soft: #F7FAF5;
    --mboa-gray: #5F6B61;
    --mboa-border: #DDE6DC;
    --ink: #123B16;
    --muted: #5F6B61;
    --line: #DDE6DC;
    --page: #F7FAF5;
    --card: #FFFFFF;
    --red: #B7F000;
    --red-hover: #C8FF1A;
    --red-active: #9ED600;
    --red-ring: rgba(183, 240, 0, 0.15);
    --error: #DC2626;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #FFFFFF 0%, var(--page) 60%),
      var(--page);
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 4vw;
    -webkit-font-smoothing: antialiased;
  }
  .auth-card {
    width: min(1180px, 92vw);
    display: grid;
    grid-template-columns: 2fr 3fr;
    background: var(--card);
    border-radius: 32px;
    overflow: hidden;
    box-shadow: 0 25px 70px rgba(0, 0, 0, 0.15);
  }
  @media (min-width: 1024px) {
    .auth-card { min-height: 680px; }
  }
  .auth-form {
    padding: 56px 60px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 30px;
    text-decoration: none;
    color: var(--ink);
  }
  .auth-form h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.2;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .auth-sub {
    font-size: 14.5px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 30px;
  }
  .auth-sub:empty { display: none; }
  .field { margin-bottom: 20px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .field input {
    width: 100%;
    height: 50px;
    padding: 0 14px;
    font-size: 14.5px;
    font-family: inherit;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    outline: none;
    transition: border-color 200ms ease, box-shadow 200ms ease;
  }
  .field input::placeholder { color: #5F6B61; }
  .field input:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 3px var(--red-ring);
  }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 44px; }
  .pw-toggle {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 150ms ease, background 150ms ease;
  }
  .pw-toggle:hover { color: var(--ink); background: #F7FAF5; }
  .pw-toggle:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .terms {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.55;
    margin: 2px 0 22px;
    cursor: pointer;
  }
  .terms input {
    width: 17px; height: 17px;
    margin-top: 1px;
    accent-color: var(--red);
    cursor: pointer;
    flex-shrink: 0;
  }
  .btn-primary {
    width: 100%;
    height: 52px;
    padding: 0 16px;
    border: none;
    border-radius: 12px;
    background: var(--red);
    color: #0A0A0A;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 200ms ease, transform 150ms ease;
  }
  .btn-primary:hover:not(:disabled) { background: var(--red-hover); }
  .btn-primary:active:not(:disabled) { background: var(--red-active); transform: scale(0.99); }
  .btn-primary:disabled { opacity: 0.65; cursor: wait; }
  .btn-primary:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 26px 0 20px;
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 500;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .btn-social {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    height: 50px;
    padding: 0 12px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    transition: background 200ms ease, border-color 200ms ease;
  }
  .btn-social:hover { background: #F7FAF5; border-color: #B7F000; }
  .btn-social:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .btn-social svg { width: 19px; height: 19px; flex-shrink: 0; }
  .gsi-wrap { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .auth-switch {
    margin-top: 24px;
    text-align: center;
    font-size: 13.5px;
    color: var(--muted);
  }
  .auth-switch button {
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    font-weight: 700;
    color: #4D7C0F;
    cursor: pointer;
  }
  .auth-switch button:hover { color: #3F6212; text-decoration: underline; }
  .auth-meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 2px 0 22px;
    font-size: 13px;
  }
  .auth-meta-row label { display: flex; align-items: center; gap: 8px; color: var(--muted); cursor: pointer; }
  .auth-meta-row input { width: 16px; height: 16px; accent-color: var(--red); cursor: pointer; }
  .auth-meta-row button {
    background: none; border: none; padding: 0;
    font: inherit; font-weight: 600; color: #4D7C0F; cursor: pointer;
  }
  .auth-meta-row button:hover { color: #3F6212; text-decoration: underline; }
  .form-error, .form-info {
    display: none;
    font-size: 13.5px;
    line-height: 1.55;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 20px;
  }
  .form-error.show, .form-info.show { display: block; }
  .form-error { background: #FEE2E2; color: var(--error); border: 1px solid #FECACA; }
  .form-info { background: #F7FAF5; color: var(--ink); border: 1px solid var(--line); }
  .form-info a { color: #4D7C0F; font-weight: 700; }
  .auth-side { min-height: 320px; }
  @media (max-width: 899px) {
    body { padding: 24px 14px; align-items: flex-start; }
    .auth-card { grid-template-columns: 1fr; border-radius: 24px; }
    .auth-form { padding: 36px 26px; order: 2; }
    .auth-side { order: 1; min-height: 240px; max-height: 280px; }
    .auth-form h1 { font-size: 25px; }
  }
  @media (max-width: 420px) {
    .auth-form { padding: 30px 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<main class="auth-card" aria-live="polite">
  <section class="auth-form">
    <a class="brand" href="index.html" aria-label="BAZAAR — accueil">
      <img src="logo/BAZAAR.png" alt="BAZAAR" width="135" height="45" style="height:36px;width:auto">
    </a>
    <h1 id="auth-title">Get Started Now</h1>
    <p class="auth-sub" id="auth-sub"></p>

    <div class="form-error" id="auth-error" role="alert"></div>
    <div class="form-info" id="auth-info" role="status"></div>

    <form id="auth-form" novalidate>
      <div id="auth-fields"></div>
      <div id="auth-extra"></div>
      <button type="submit" class="btn-primary" id="auth-submit">Signup</button>
    </form>

    <div id="auth-social-block">
      <div class="divider"><span>or</span></div>
      <button type="button" class="btn-social" id="btn-google" aria-label="Continuer avec Google">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.3-2.3H12v4.5h6.5c-.1 1.1-.8 2.7-2.4 3.8l-.1.1 3.5 2.7.2.1c2.2-2 3.8-5 3.8-8.9z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.8-2.9c-1 .7-2.4 1.2-4.1 1.2-3.2 0-5.9-2.1-6.8-5l-.1.1-3.6 2.8-.1.1C3.5 21.3 7.4 24 12 24z"/><path fill="#FBBC05" d="M5.2 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.7.4-2.4l-.1-.1-3.6-2.8-.1.1C.5 8.7 0 10.2 0 12s.5 3.3 1.4 4.7l3.8-2.3z"/><path fill="#EA4335" d="M12 4.7c1.8 0 3 .8 3.7 1.4l3.3-3.2C17.9 1.1 15.2 0 12 0 7.4 0 3.5 2.7 1.4 6.8l3.8 2.9c.9-2.9 3.6-5 6.8-5z"/></svg>
        <span>Continuer avec Google</span>
      </button>
      <div class="gsi-wrap" id="googleBtnContainer"></div>
    </div>

    <p class="auth-switch" id="auth-switch"></p>
  </section>

  <aside class="auth-side" aria-label="Produits BAZAAR en avant-première">
    <div class="ms-showcase" data-showcase style="height:100%"></div>
  </aside>
</main>

<script>
/* ============================================================
   BAZAAR — Page d'authentification unique (layout partagé)
   Modes : login | register | forgot | reset | verify (?mode=).
   Seuls titre, champs et bouton changent ; mise en page identique.
   Backend réel : /api/supplier/login, /api/supplier/register,
   /api/supplier/google. Pas de endpoint reset/verify côté API :
   ces modes affichent un message de contact support (aucun
   appel fictif).
   ============================================================ */
const API = '/api/supplier';
let GOOGLE_CLIENT_ID = '748209712105-k04jfq3re9gvc1scmfj6djr9vg2uhfd7.apps.googleusercontent.com';
fetch(API + '/google-client-id').then(r => r.ok ? r.json() : null).then(d => {
  if (d && d.clientId) GOOGLE_CLIENT_ID = d.clientId;
}).catch(() => {});

const $ = id => document.getElementById(id);
const errBox = $('auth-error'), infoBox = $('auth-info');
function escAuth(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function showError(msg) {
  infoBox.classList.remove('show'); infoBox.textContent = '';
  errBox.textContent = msg; errBox.classList.add('show');
}
function showInfo(html) {
  errBox.classList.remove('show'); errBox.textContent = '';
  infoBox.innerHTML = html; infoBox.classList.add('show');
}
function clearMsg() {
  errBox.classList.remove('show'); errBox.textContent = '';
  infoBox.classList.remove('show'); infoBox.innerHTML = '';
}
const SUPPORT_HTML = 'Password reset is handled by our support team: <a href="mailto:support@mboastyle.cm">contact us by email</a>.';

function pwField(f) {
  if (f.type !== 'password') {
    return '<div class="field"><label for="' + f.id + '">' + f.label + '</label>' +
      '<input id="' + f.id + '" type="' + f.type + '" placeholder="' + (f.placeholder || '') + '"' +
      (f.autocomplete ? ' autocomplete="' + f.autocomplete + '"' : '') +
      (f.required ? ' required' : '') +
      (f.minlength ? ' minlength="' + f.minlength + '"' : '') +
      (f.maxlength ? ' maxlength="' + f.maxlength + '"' : '') +
      (f.inputmode ? ' inputmode="' + f.inputmode + '"' : '') + '></div>';
  }
  return '<div class="field"><label for="' + f.id + '">' + f.label + '</label>' +
    '<div class="pw-wrap"><input id="' + f.id + '" type="password" placeholder="' + (f.placeholder || '') + '"' +
    (f.autocomplete ? ' autocomplete="' + f.autocomplete + '"' : '') +
    (f.required ? ' required' : '') +
    (f.minlength ? ' minlength="' + f.minlength + '"' : '') + '>' +
    '<button type="button" class="pw-toggle" data-pw-for="' + f.id + '" aria-label="Afficher le mot de passe"><i class="bi bi-eye"></i></button></div></div>';
}

function togglePw(btn) {
  const input = document.getElementById(btn.getAttribute('data-pw-for'));
  if (!input) return;
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
  btn.querySelector('i').className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
  input.focus();
}

const MODES = {
  login: {
    title: 'Welcome Back',
    sub: 'Connectez-vous pour gérer votre boutique, vos commandes et vos revenus.',
    submit: 'Sign In',
    fields: [
      { id: 'f-email', label: 'Email address', type: 'email', placeholder: '', autocomplete: 'email', required: true },
      { id: 'f-password', label: 'Password', type: 'password', placeholder: '', autocomplete: 'current-password', required: true }
    ],
    extra: 'remember',
    social: true,
    switch: { text: 'New here? ', link: 'Sign Up', mode: 'register' }
  },
  register: {
    title: 'Get Started Now',
    sub: 'Rejoignez les boutiques qui vendent sur BAZAAR.',
    submit: 'Signup',
    fields: [
      { id: 'f-name', label: 'Name', type: 'text', placeholder: '', autocomplete: 'organization', required: true },
      { id: 'f-email', label: 'Email address', type: 'email', placeholder: '', autocomplete: 'email', required: true },
      { id: 'f-password', label: 'Password', type: 'password', placeholder: '', autocomplete: 'new-password', required: true, minlength: 6 }
    ],
    extra: 'terms',
    social: true,
    switch: { text: 'Have an account? ', link: 'Sign In', mode: 'login' }
  },
  forgot: {
    title: 'Forgot Password',
    sub: 'Enter your email, our support team will send you a reset link.',
    submit: 'Send Link',
    fields: [
      { id: 'f-email', label: 'Email address', type: 'email', placeholder: '', autocomplete: 'email', required: true }
    ],
    extra: null,
    social: false,
    switch: { text: 'Remember it? ', link: 'Sign In', mode: 'login' }
  },
  reset: {
    title: 'Reset Password',
    sub: 'Choose a new password for your seller account.',
    submit: 'Reset Password',
    fields: [
      { id: 'f-password', label: 'New password', type: 'password', placeholder: '', autocomplete: 'new-password', required: true, minlength: 6 },
      { id: 'f-password2', label: 'Confirm password', type: 'password', placeholder: '', autocomplete: 'new-password', required: true, minlength: 6 }
    ],
    extra: null,
    social: false,
    switch: { text: 'Remember it? ', link: 'Sign In', mode: 'login' }
  },
  verify: {
    title: 'Check Your Email',
    sub: 'Votre compte est en train d\u2019être utilisé pour se connecter à BAZAAR. Saisissez le code à 6 chiffres envoyé à votre adresse email : sans ce code, l\u2019accès est refusé.',
    submit: 'Verify',
    fields: [
      { id: 'f-code', label: 'Verification code', type: 'text', placeholder: '', autocomplete: 'one-time-code', required: true, minlength: 6, maxlength: 6, inputmode: 'numeric' }
    ],
    extra: null,
    social: false,
    switch: { text: 'Did not get it? ', link: 'Resend code', action: 'resend' }
  }
};

let pendingAuthEmail = '';

let currentMode = 'register';
function modeFromURL() {
  const m = new URLSearchParams(location.search).get('mode');
  return MODES[m] ? m : 'register';
}

function renderMode(mode) {
  currentMode = MODES[mode] ? mode : 'register';
  const cfg = MODES[currentMode];
  try { history.replaceState(null, '', '?mode=' + currentMode); } catch (e) {}
  document.title = 'BAZAAR — ' + cfg.title;
  $('auth-title').textContent = cfg.title;
  $('auth-sub').textContent = cfg.sub;
  clearMsg();
  $('auth-fields').innerHTML = cfg.fields.map(pwField).join('');
  $('auth-fields').querySelectorAll('[data-pw-for]').forEach(b =>
    b.addEventListener('click', () => togglePw(b)));
  const extra = $('auth-extra');
  if (cfg.extra === 'terms') {
    extra.innerHTML = '<label class="terms"><input type="checkbox" id="f-terms" required><span>I agree to the terms &amp; policy</span></label>';
  } else if (cfg.extra === 'remember') {
    extra.innerHTML = '<div class="auth-meta-row"><label><input type="checkbox" id="f-remember" checked><span>Remember me</span></label>' +
      '<button type="button" data-goto="forgot">Forgot password?</button></div>';
  } else {
    extra.innerHTML = '';
  }
  $('auth-submit').textContent = cfg.submit;
  $('auth-social-block').style.display = cfg.social ? '' : 'none';
  if (cfg.switch.action === 'resend') {
    $('auth-switch').innerHTML = cfg.switch.text + '<button type="button" data-action="resend">' + cfg.switch.link + '</button>';
    $('auth-switch').querySelector('[data-action="resend"]').addEventListener('click', resendVerifyCode);
  } else {
    $('auth-switch').innerHTML = cfg.switch.text + '<button type="button" data-goto="' + cfg.switch.mode + '">' + cfg.switch.link + '</button>';
    $('auth-switch').querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => renderMode(b.dataset.goto)));
  }
  const first = $('auth-fields').querySelector('input');
  if (first) first.focus();
}

async function resendVerifyCode() {
  if (!pendingAuthEmail) { showError('Reconnectez-vous pour recevoir un code.'); return; }
  try {
    const res = await fetch(API + '/resend-code', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: pendingAuthEmail }) });
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.message || 'Resend failed');
    showInfo('Un nouveau code à 6 chiffres a été envoyé à votre adresse email.');
  } catch (err) {
    showError(err.message || 'Something went wrong.');
  }
}

/* Code à 6 chiffres uniquement (chiffres). */
document.addEventListener('input', e => {
  if (e.target && e.target.id === 'f-code') {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
  }
});

function enterAfterAuth(data, welcomeMsg) {
  localStorage.setItem('supplier_token', data.token);
  localStorage.setItem('supplier', JSON.stringify(data.supplier || {}));
  location.href = 'fournisseur.html';
}

$('auth-form').addEventListener('submit', async e => {
  e.preventDefault();
  clearMsg();
  const btn = $('auth-submit');
  const done = () => { btn.disabled = false; btn.textContent = MODES[currentMode].submit; };
  btn.disabled = true; btn.textContent = 'Please wait…';
  try {
    const val = id => (document.getElementById(id) || {}).value ? document.getElementById(id).value.trim() : '';
    if (currentMode === 'login') {
      const res = await fetch(API + '/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: val('f-email'), password: val('f-password') }) });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.message || 'Incorrect credentials');
      if (data.requiresVerification) {
        pendingAuthEmail = data.email || val('f-email');
        renderMode('verify');
        showInfo('Un code à 6 chiffres a été envoyé à <b>' + escAuth(data.maskedEmail || pendingAuthEmail) + '</b>. Saisissez-le pour vérifier qu\u2019il s\u2019agit bien de votre adresse email.');
        return;
      }
      enterAfterAuth(data);
      return;
    }
    if (currentMode === 'register') {
      const body = { name: val('f-name'), email: val('f-email'),
        password: val('f-password') };
      const res = await fetch(API + '/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.message || 'Signup failed');
      if (data.requiresVerification) {
        pendingAuthEmail = data.email || body.email;
        renderMode('verify');
        showInfo('Compte créé ! Un code à 6 chiffres a été envoyé à <b>' + escAuth(data.maskedEmail || pendingAuthEmail) + '</b>. Saisissez-le pour accéder à votre espace.');
        return;
      }
      enterAfterAuth(data);
      return;
    }
    if (currentMode === 'verify') {
      if (!pendingAuthEmail) throw new Error('Reconnectez-vous pour recevoir un code.');
      const code = val('f-code');
      if (!/^[0-9]{6}$/.test(code)) throw new Error('Saisissez le code à 6 chiffres reçu par email.');
      const res = await fetch(API + '/verify-code', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: pendingAuthEmail, code }) });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.message || 'Code incorrect');
      pendingAuthEmail = '';
      enterAfterAuth(data);
      return;
    }
    if (currentMode === 'reset') {
      const p1 = val('f-password');
      const p2 = val('f-password2');
      if (p1 !== p2) throw new Error('Passwords do not match.');
    }
    showInfo(SUPPORT_HTML);
  } catch (err) {
    showError(err.message || 'Something went wrong.');
  } finally {
    done();
  }
});

/* ---------- Google (même flux que l'espace fournisseur) ---------- */
function handleGoogleCredential(response) {
  (async () => {
    try {
      showInfo('Google sign-in in progress…');
      const res = await fetch(API + '/google', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken: response.credential }) });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.message || 'Google sign-in failed');
      enterAfterAuth(data);
    } catch (err) {
      showError(err.message);
    }
  })();
}
function initGoogleSignIn() {
  if (typeof google === 'undefined' || !google.accounts || !google.accounts.id) {
    setTimeout(initGoogleSignIn, 300);
    return;
  }
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleCredential });
  const container = $('googleBtnContainer');
  if (container) {
    google.accounts.id.renderButton(container, { theme: 'outline', size: 'large', width: 320, text: 'continue_with', logo_alignment: 'center' });
  }
}
$('btn-google').addEventListener('click', () => {
  const btn = document.querySelector('#googleBtnContainer div[role="button"]');
  if (btn) { btn.click(); return; }
  showError('The Google button is still loading, please try again in a moment.');
});

document.addEventListener('DOMContentLoaded', () => {
  renderMode(modeFromURL());
  initGoogleSignIn();
});
window.addEventListener('popstate', () => renderMode(modeFromURL()));
</script>
