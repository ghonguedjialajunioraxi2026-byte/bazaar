<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — MBOA STYLE</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23087443'/><text x='50' y='70' font-size='56' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>M</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { primary: { 600:'#087443', 700:'#065C36' }, dark: { 900:'#0f172a' } },
  fontFamily: { sans:['Manrope','system-ui','sans-serif'] }
}}};
</script>
</head>
<body class="antialiased" style="background-color:#F4F6F5;font-family:'Manrope',system-ui,sans-serif">
<main class="min-h-screen flex items-center justify-center px-4">
  <div class="text-center max-w-md">
    <p class="font-display text-7xl font-extrabold text-primary-700 tabular-nums">404</p>
    <h1 class="text-2xl font-bold text-dark-900 mt-2 mb-3">Page introuvable</h1>
    <p class="text-slate-500 text-sm mb-8">La page que vous cherchez n'existe pas ou a été déplacée.</p>
    <div class="flex flex-wrap justify-center gap-3">
      <a href="/" class="px-6 py-3 bg-primary-700 hover:bg-primary-800 text-white text-sm font-bold rounded-2xl transition">Accueil</a>
      <button onclick="if (history.length > 1) history.back(); else location.href='/'" class="px-6 py-3 bg-white border border-slate-200 hover:border-slate-400 text-sm font-bold rounded-2xl transition">Retour</button>
    </div>
  </div>
</main>
</body>
</html>
