# MBOA STYLE — Reverse proxy Nginx (Phase 22, À ADAPTER sur le vrai serveur).
# Nginx NON INSTALLÉ dans cet environnement : fichier fourni pour la Phase 22
# réelle. Domaine : remplacer mboastyle.cm si différent (doit matcher APP_BASE_URL).
#
# Prérequis : certificat TLS (ex. certbot) + Tomcat sur 127.0.0.1:8080.

upstream mboa_tomcat {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name mboastyle.cm www.mboastyle.cm;
    # HTTP -> HTTPS (production). Certificat : voir Phase 22 réelle.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mboastyle.cm www.mboastyle.cm;

    # ssl_certificate     /etc/letsencrypt/live/mboastyle.cm/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mboastyle.cm/privkey.pem;

    client_max_body_size 32m;  # >= MultipartConfig 30 Mo
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Statiques : cache long (noms UUID immuables pour les uploads).
    location ~* ^/(assets|uploads)/ {
        proxy_pass http://mboa_tomcat;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # API : jamais de cache public (données privées).
    location /api/ {
        proxy_pass http://mboa_tomcat;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://mboa_tomcat;
    }
}
